# Analysis period
analysis:
  start_year:        2000
  end_year:          2024
  base_period_start: 2000
  base_period_end:   2020

# Drought/streamflow thresholds 
# Review and confirm with Tribal water staff for each specific gauge
# Units: cfs (cubic feet per second)
thresholds:
  streamflow:
    normal_cfs:    50
    watch_cfs:     20
    emergency_cfs:  5

  groundwater:
    decline_rate_ft_per_month: 0.5
    critical_pct:              10
    recovery_pct:              90

  water_quality:
    nitrate_mgl:    10.0    # EPA MCL
    arsenic_ugl:    10.0    # EPA MCL
    tds_mgl:       500.0    # EPA secondary standard
    ph_min:          6.5
    ph_max:          8.5
    turbidity_ntu:   1.0    # drinking water standard
    fluoride_mgl:    4.0    # EPA MCL

  drought:
    moderate: -2.0    # PDSI <= -2.0
    severe:   -3.0    # PDSI <= -3.0
    extreme:  -4.0    # PDSI <= -4.0

# Compound Water Stress Index weights (notebook 06)
# Must sum to 1.0
stress_index_weights:
  groundwater: 0.40
  streamflow:  0.30
  drought:     0.30

# Pipeline data paths
paths:
  raw:       data/raw
  cache:     data/cache
  processed: data/processed
  templates: data/templates
  outputs:   outputs
  figures:   outputs/figures

# Dashboard settings
dashboard:
  title:      "Tribal Water Monitoring"
  center_lat:  43.3
  center_lon: -102.5
  zoom:         8
  map_style:  "light"

