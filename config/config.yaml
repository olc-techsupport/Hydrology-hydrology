# OLC Pine Ridge hydrology series configuration
project:
  title: "Pine Ridge Hydrology"
  institution: "Oglala Lakota College"
  department: "Math and Science Department"
  funder: "USDA National Institute of Food and Agriculture (NIFA)"
  author: "Lilly Jones, PhD"
  governance_contact:
    name: "Camille Griffith, PhD"
    role: "Director, OST Research Review Board and OLC Institutional Review Board"
    email: "cgriffith@olc.edu"
  governance_status: "Draft pending OST RRB and OLC IRB review"

study_area:
  nation: "Oglala Sioux Tribe"
  people: "Oglala Lakota"
  census_boundary_name: "Pine Ridge"
  reservation_name: "Pine Ridge Reservation"
  # Screening envelope for Pine Ridge and immediately adjacent hydrologic context.
  # Inclusion in this box does not imply that a site is within the Reservation.
  hydrologic_context_bbox: [-103.5, 42.5, -101.5, 43.8]
  centroid: {lat: 43.35, lon: -102.09}
  climate_division: 7

analysis: {start_year: 2000, end_year: 2024, base_period_start: 2000, base_period_end: 2020}

# Sites may be outside the Census boundary when needed to describe connected
# watersheds or upstream/downstream conditions. Every gauge has a rationale.
usgs_streamflow_sites:
  - {id: "06445685", name: "White River near Nebraska-South Dakota state line", context: "upstream White River boundary condition"}
  - {id: "06446000", name: "White River near Oglala, SD", context: "White River adjacent to Pine Ridge"}
  - {id: "06446700", name: "Bear in the Lodge Creek near Wanblee, SD", context: "tributary draining the Pine Ridge study area"}
  - {id: "06446500", name: "White River near Interior, SD", context: "downstream White River comparison"}
  - {id: "06447000", name: "White River near Kadoka, SD", context: "downstream White River comparison"}
  - {id: "06447500", name: "Little White River near Martin, SD", context: "stream associated with the eastern Pine Ridge area"}
  - {id: "06449100", name: "Little White River near Vetal, SD", context: "downstream hydrologic context"}
  - {id: "06449000", name: "Lake Creek below refuge near Tuthill, SD", context: "Little White River tributary context"}

usgs_groundwater_sites:
  - "432731102261101"
  - "432301102574701"
  - "425957102193601"
  - "431948102331201"
  - "432457102191001"
  - "431503102285701"
