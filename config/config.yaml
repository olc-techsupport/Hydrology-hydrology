thresholds:
  status: "screening defaults; not approved operational triggers"
  streamflow: {normal_cfs: 50, watch_cfs: 20, emergency_cfs: 5}
  groundwater: {decline_rate_ft_per_month: 0.5, critical_pct: 10, recovery_pct: 90}
  water_quality: {nitrate_mgl: 10.0, arsenic_ugl: 10.0, tds_mgl: 500.0, ph_min: 6.5, ph_max: 8.5, turbidity_ntu: 1.0, fluoride_mgl: 4.0}
  drought: {moderate: -2.0, severe: -3.0, extreme: -4.0}

stress_index_weights: {groundwater: 0.40, streamflow: 0.30, drought: 0.30}
paths: {raw: data/raw, cache: data/cache, processed: data/processed, templates: data/templates, outputs: outputs, figures: outputs/figures}
dashboard: {title: "Pine Ridge Hydrology", center_lat: 43.3, center_lon: -102.5, zoom: 8, map_style: "light"}

governance:
  care: "https://www.gida-global.org/care"
  fair: "https://www.go-fair.org/fair-principles/"
  ieee_2890: "https://standards.ieee.org/ieee/2890/10318/"
  local_contexts: "https://localcontexts.org/"
  note: "Specific OST RRB/OLC IRB wording and the applicability of OCAP are deferred for review."
