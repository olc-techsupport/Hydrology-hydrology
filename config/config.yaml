# tribal_water_monitoring configuration

# All configurable parameters live here.
# To adapt this system for a different Tribal Nation:
#   1. Update usgs_streamflow_sites with gauges near your territory
#   2. Update bounding_box for your region
#   3. Update thresholds in consultation with water office staff

# Tribal context 
nation:
  primary:    "Oglala Lakota"
  secondary:  "Sicangu Lakota"
  collective: "Oceti Sakowin"

# Bounding box (WGS84: west, south, east, north)
# Covers Pine Ridge, Rosebud and surrounding Oceti Sakowin territory
bounding_box:
  west:  -104.5
  south:   42.3
  east:   -96.4
  north:   46.5

# USGS NWIS streamflow gauge sites
# All Pine Ridge and Rosebud gauges from constants.py
# Find additional gauges at: https://waterdata.usgs.gov/nwis
